          <tr><td>GitHub Actions</td><td>云上托管，YAML 声明式，生态丰富，开源项目标配</td></tr>
          <tr><td>云厂商流水线</td><td>CodePipeline / 阿里云云效：和云资源天然集成</td></tr>
          <tr><td>Tekton</td><td>云原生 CI/CD（K8s 原生），流水线也是 CRD——K8s 圈趋势</td></tr></table>
          <p>面试点：不用背全部，讲清"<b>声明式 YAML 是主流、K8s 原生（Tekton/ArgoCD）是大趋势</b>"就够。</p>`},
        { id:9, title:'发布策略：蓝绿 / 金丝雀 / 滚动', tags:['核心','面试'],
          content:`<table class="tbl"><colgroup><col style="width:22%"><col style="width:78%"></colgroup>
          <tr><th>策略</th><th>机制与适用</th></tr>
          <tr><td>滚动（Rolling）</td><td>新老副本交替（K8s Deployment 默认，maxSurge/maxUnavailable 控制节奏）——无感、资源占用平稳</td></tr>
          <tr><td>蓝绿（Blue/Green）</td><td>两套环境切换：新版本全量就绪 → 流量整体切到绿——回滚=切回蓝，秒级；成本翻倍（要两套资源）</td></tr>
          <tr><td>金丝雀（Canary）</td><td>先放 5%-10% 流量给新版本观察，无异常再逐步放量——最稳妥，灰度发布标配（Istio/Argo Rollouts 实现）</td></tr></table>
          <div class="code-block"># K8s 里的对应
滚动：Deployment rollout（你实战过！模块 3）
金丝雀：Ingress/Service Mesh 按权重分流
蓝绿：两套 Deployment + Service 切换标签（kubectl patch svc selector 版本=v2）</div>
          <p class="kbox"><b>面试讲法：</b>"我实战过 K8s 滚动更新（1 of 3 new replicas 的交替过程）和 rollout undo 秒级回滚；金丝雀/蓝绿是生产发布标配，原理是流量控制不是双份环境。"</p>`},
        { id:10, title:'流水线 → K8s 的完整闭环', tags:['重要','面试'],
          content:`<div class="code-block"># 一次标准发布的完整链路
开发提交代码 (git push)
  ↓ CI：拉代码 → 单元测试 → 构建镜像 → 推镜像仓库
  ↓ 质量门禁：trivy 镜像扫描 / 代码扫描 / 测试报告
  ↓ CD 触发（自动 或 人工审批）
  ↓ 部署到 K8s（三选一）
     ① kubectl set image deployment/app app=img:v2   ← 最简单
     ② helm upgrade app ./chart --set image.tag=v2   ← 参数化
     ③ ArgoCD 同步（GitOps，见模块 9）               ← 声明式
  ↓ rollout status 确认发布成功
  ↓ 失败？ rollout undo 回滚上一版本</div>
          <p>面试点：能完整画出这条链路 + 说出每步的失败处理，就是"有 CI/CD 实战思维"的证明（哪怕在练习环境跑的）。</p>`}
      ]}
    ]
  },

  {
    id:10, title:'公有云与合规', icon:'cloud', subtitle:'阿里云 / AWS 核心服务、成本控制、等保映射',
    sections:[
      { title:'核心服务', points:[
        { id:1, title:'云上网络：VPC 三件套', tags:['核心'],
          content:`<p>VPC（私有网络）是云上一切的基础：</p>
          <table class="tbl"><colgroup><col style="width:26%"><col style="width:74%"></colgroup>
          <tr><th>组件</th><th>作用</th></tr>
          <tr><td>子网（Subnet）</td><td>网段划分：公网子网（挂 NAT/EIP）/ 私网子网（内部服务）</td></tr>
          <tr><td>路由表</td><td>流量走向：默认本地路由 + 指向 NAT/IGW 的路由</td></tr>
          <tr><td>安全组 / 网络 ACL</td><td>实例级/子网级防火墙（五元组规则）</td></tr></table>
          <p>典型架构：<b>SLB（公网）→ 应用服务器（公网子网）→ RDS/Redis（私网子网）</b>。面试点：为什么数据库放私网？——只允许应用访问，不暴露公网。</p>`},
        { id:2, title:'计算与存储', tags:['重要'],
          content:`<table class="tbl"><colgroup><col style="width:24%"><col style="width:76%"></colgroup>
          <tr><th>服务</th><th>说明</th></tr>
          <tr><td>ECS / EC2</td><td>云服务器：按量付费可随时销毁（学习首选）；镜像、快照、弹性伸缩组</td></tr>
          <tr><td>OSS / S3</td><td>对象存储：静态资源、备份归档；生命周期策略降成本</td></tr>
          <tr><td>RDS</td><td>托管数据库：自动备份、高可用、性能监控（省去自己搭主从）</td></tr>
          <tr><td>SLB / ELB</td><td>负载均衡：四层/七层，健康检查，自动摘除故障实例</td></tr></table>
          <p>面试点：RDS vs 自建 MySQL 的取舍（托管省运维 vs 自建灵活可控 + 省钱）。</p>`},
        { id:3, title:'IAM 最小权限', tags:['重要'],
          content:`<p>IAM = 云的 RBAC：<b>用户/角色/策略</b>三件套，原则是<b>最小权限</b>。</p>
          <div class="code-block"># 策略示例（JSON）：只允许操作指定 Bucket
{
  "Version": "1",
  "Statement": [{
    "Effect": "Allow",
    "Action": ["oss:GetObject"],
    "Resource": ["acs:oss:*:*:my-bucket/*"]
  }]
}</div>
          <p>危险操作（面试点）：<b>不要用主账号 AK 跑业务</b>；AK 泄漏是云上第一大事故源（GitHub 搜到即被盗刷）。配 <b>AccessKey 轮换</b> + <b>子账号</b> + <b>最小权限策略</b>。</p>`}
      ]},
      { title:'成本控制', points:[
        { id:4, title:'预算告警与防护', tags:['重要','高危'],
          content:`<p>云上学习第一原则：<b>先设预算告警，再开资源</b>。</p>
          <div class="code-block"># 阿里云：用户中心 → 预算管理 → 设置月度预算 + 阈值告警（80%/100%）
# AWS：Budgets + Cost Anomaly Detection
# 必做清单
1. 所有实验资源用按量付费
2. 每次实验结束 terraform destroy / 手动释放
3. 数据库/负载均衡/公网 IP 是最容易遗忘的扣费项
4. 设置 MFA（多因素认证）防被盗</div>
          <p>典型事故：ECS 忘记释放月扣几百、EIP 挂着没人用也在收费、RDS 默认多可用区贵一倍。面试能讲"你如何防止云费用失控"很加分。</p>`}
      ]},
      { title:'合规', points:[
        { id:5, title:'等保 2.0 速览', tags:['重要'],
          content:`<p>国内合规基准：<b>等级保护 2.0</b>，分五级（1-5 逐级严格），云上常见二级/三级。</p>
          <table class="tbl"><colgroup><col style="width:30%"><col style="width:70%"></colgroup>
          <tr><th>控制项</th><th>落地动作</th></tr>
          <tr><td>身份鉴别</td><td>双因素认证（MFA）、密码复杂度、登录失败锁定</td></tr>
          <tr><td>访问控制</td><td>最小权限、角色分离（运维/开发/审计）</td></tr>
          <tr><td>安全审计</td><td>操作日志留存 ≥ 180 天、云审计开启</td></tr>
          <tr><td>入侵防范</td><td>补丁管理、主机安全 Agent、WAF/防火墙</td></tr>
          <tr><td>数据备份</td><td>定期备份 + 异地容灾 + 恢复演练</td></tr></table>
          <p>面试答法：把等保条款映射到你自己的集群配置（如"日志留存 180 天 → 我们的 Loki 日志保留策略"），比背条款强。</p>`}
      ]}
    ]
  },

  {
    id:11, title:'AI 大模型与 HiAgent', icon:'ai', subtitle:'大模型概念、推理部署、Agent 平台、技术支持方法论',
    sections:[
      { title:'大模型概念', points:[
        { id:1, title:'Token 与上下文窗口', tags:['核心','面试'],
          content:`<p>模型不读"字"，读 <b>Token</b>：中文约 1 汉字 ≈ 1~2 Token，英文 1 词 ≈ 1 Token。</p>
          <p class="kbox"><b>Token 是计费单位 + 延迟单位 + 容量单位</b>：
          ① 计费：按输入+输出 Token 数收费；
          ② 延迟：生成是逐 Token 吐出，输出越长越慢；
          ③ 容量：上下文窗口（context window）= 一次能"看见"的 Token 上限。</p>
          <p>客户报"慢"第一步换算：<b>这个请求多少输入 Token、多少输出 Token？</b>报"记不住之前的对话"→ 上下文窗口截断/裁剪了历史。</p>`},
        { id:2, title:'推理 vs 训练/微调', tags:['核心','面试'],
          content:`<table class="tbl"><colgroup><col style="width:24%"><col style="width:76%"></colgroup>
          <tr><th></th><th>说明</th></tr>
          <tr><td>预训练</td><td>海量数据学通用能力（算法团队的事）</td></tr>
          <tr><td>微调 SFT</td><td>用标注数据教模型"说话风格/领域知识"（LoRA 只调一小部分参数，成本低）</td></tr>
          <tr><td>推理 Inference</td><td><b>加载模型 → 收请求 → 生成回答</b>（技术支持的主战场：部署/扩容/排障/调优）</td></tr></table>
          <p class="kbox"><b>面试诚实原则：</b>JD 写"掌握 SFT/LoRA"——你能讲清"LoRA 是冻结原参数、只训练低秩增量、省显存省算力"即可，别吹做过训练。技术支持岗核心考推理链路。</p>`},
        { id:3, title:'RAG 与 Agent', tags:['核心','面试'],
          content:`<p><b>RAG（检索增强生成）</b>：模型不知道的知识，先检索再回答——解决"模型知识过期/幻觉"。</p>
          <div class="code-block">用户提问
  ↓
① 检索：知识库向量化 → 找最相关的几段（向量数据库）
  ↓
② 增强：把"问题 + 检索到的资料"拼进 prompt
  ↓
③ 生成：模型基于资料回答（可溯源）
# 客户报"回答不专业/瞎编" → 大概率是知识库覆盖不足或检索不到 → 查知识库质量</div>
          <p><b>Agent（智能体）</b>：大模型 + 工具（API/代码/搜索）+ 自主规划循环。HiAgent 就是帮企业搭建这种智能体的平台。</p>`}
      ]},
      { title:'推理部署', points:[
        { id:4, title:'GPU 与显存（OOM 根源）', tags:['核心','面试'],
          content:`<p>模型权重<b>必须整块塞进 GPU 显存（VRAM）</b>：7B 模型约 14GB，70B 约 140GB。显存决定"能不能跑 + 同时服务多少人"。</p>
          <div class="code-block"># K8s 里 GPU 是独立资源单位（不再是 CPU/memory）
resources:
  requests: { nvidia.com/gpu: 1 }
  limits:   { nvidia.com/gpu: 1 }

# 排查显存
nvidia-smi                # 显存占用 / 进程
kubectl describe pod xxx  # 看 GPU 分配与事件</div>
          <p><b>OOM 三连问</b>（面试场景题）：并发上来显存爆了？→ 限制并发（vLLM 的 max-num-seqs）/ 换更小模型 / 加卡；长上下文撑爆？→ 裁剪上下文 / 调 KV cache 策略；单请求超长输出？→ 设 max-tokens 上限。</p>`},
        { id:5, title:'推理服务架构（vLLM）', tags:['核心'],
          content:`<div class="code-block"># 部署形态（和你熟的 nginx 同构！）
客户应用 → API 网关/SSE 流式 → 推理 Pod（vLLM + 模型权重，GPU 节点）
                                        ↓ 读
                                  模型权重（挂载盘/缓存）
                                        ↓ 可选
                                  知识库向量库（RAG）

# 核心指标
TTFT（首 Token 延迟）：请求进去到第一个字出来     ← 用户感知"半天不出字"
tokens/s（生成速度）：每秒吐多少 Token           ← 用户感知"打字慢"
并发（QPS / 并发会话数）：显存和算力共同决定</div>
          <p class="kbox"><b>与 K8s 的对应：</b>vLLM = 你的 nginx 镜像，模型权重 = PV 挂载，GPU 节点 = 有 GPU 的节点池，HPA 扩容 = 按 GPU 利用率/队列长度伸缩。你的 K8s 经验直接迁移。</p>`},
        { id:6, title:'模型幻觉与知识库', tags:['面试'],
          content:`<p><b>幻觉（Hallucination）</b>：模型一本正经地胡说。客户报"回答不专业/乱讲"时排查顺序：</p>
          <div class="code-block">① 是 RAG 检索没命中？→ 查知识库文档覆盖度、切分方式、相似度阈值
② 是模型硬编？→ 查 prompt 是否要求"只基于资料回答"
③ 是资料本身过期？→ 查知识库更新频率
④ 系统提示词配置：温度（temperature）太高会加大编造概率</div>
          <p>这是 HiAgent JD 第 5 条的实战版："把'回答不专业'拆解为知识库覆盖度不足"。</p>`}
      ]},
      { title:'HiAgent 产品', points:[
        { id:7, title:'HiAgent 是什么', tags:['核心','面试'],
          content:`<p><b>火山引擎 HiAgent = 企业级 Agent 平台（企业 AI 中台）</b>，客户买它来搭建生产级智能体。</p>
          <table class="tbl"><colgroup><col style="width:26%"><col style="width:74%"></colgroup>
          <tr><th>能力</th><th>说明</th></tr>
          <tr><td>智能体开发</td><td>高/低代码搭建：知识库、工作流、插件/工具、多模型接入</td></tr>
          <tr><td>全生命周期</td><td>开发 → 评测 → 观测 → 优化（Agent DevOps）</td></tr>
          <tr><td>模型服务</td><td>接入豆包全系列模型，支持推理、精调</td></tr>
          <tr><td>私有化部署</td><td>支持私有化安全集成（→ 客户现场部署 = 技术支持的工作）</td></tr>
          <tr><td>治理</td><td>权限、审计、监控（企业级必备）</td></tr></table>
          <p>典型客户案例：浦发银行全行智能体平台（1000+ 智能体）、客服营销智能体（累计调用 4000 万次）——银行/金融是 HiAgent 主力场景。</p>`},
        { id:8, title:'智能体的构成', tags:['核心'],
          content:`<p>一个生产级智能体 = <b>大模型（大脑）+ 知识库（记忆）+ 工具（手脚）+ 工作流（流程）</b>。</p>
          <div class="code-block"># 客户的一句话需求 → 技术支持翻译成技术方案
"我的客服回答不专业"
  ↓ 拆解
知识库覆盖不足？→ 扩充 FAQ/产品文档
检索不准？→ 调相似度阈值 / 优化文档切分
模型能力不够？→ 换更强模型
流程不对？→ 加人工兜底/转人工规则

# 这就是 JD 里"把客户模糊需求转化为技术方案"的能力</div>
          <p>面试答法：给一个你拆解需求的例子（客服、知识问答、流程自动化都行），展示"现象 → 假设 → 验证 → 方案"的链路。</p>`}
      ]},
      { title:'技术支持方法论', points:[
        { id:9, title:'先问三件事，再看指标', tags:['核心','面试'],
          content:`<p>客户报"模型好慢/好差"时，<b>先问客户能回答的问题，不要急着翻日志</b>：</p>
          <table class="tbl"><colgroup><col style="width:30%"><col style="width:70%"></colgroup>
          <tr><th>问题</th><th>区分什么</th></tr>
          <tr><td>① "慢"是哪种慢？</td><td>半天不出第一个字（TTFT：排队/冷启动/网络）vs 开始打字但转圈久（生成速度：显存/模型）</td></tr>
          <tr><td>② 全都慢还是部分场景慢？</td><td>全局资源瓶颈 vs 特定上下文超长/特定模型配置</td></tr>
          <tr><td>③ 最近改过什么？</td><td>变更即根因：prompt 加长、并发上来、模型版本切换、接入方式变化</td></tr></table>
          <p>拿到回答后再看指标：Token 数、TTFT、tokens/s、错误率、队列长度、显存。</p>`},
        { id:10, title:'五大典型故障场景', tags:['面试'],
          content:`<table class="tbl"><colgroup><col style="width:26%"><col style="width:74%"></colgroup>
          <tr><th>客户报障</th><th>排查链路</th></tr>
          <tr><td>回答慢</td><td>TTFT vs 生成速度 → 并发/队列/显存/网络 → 变更回溯</td></tr>
          <tr><td>回答不专业/幻觉</td><td>RAG 检索命中 → 知识库覆盖/切分/阈值 → prompt → 温度</td></tr>
          <tr><td>记不住对话</td><td>上下文窗口截断 → 裁剪策略/会话管理 → 客户端是否传历史</td></tr>
          <tr><td>偶发报错/超时</td><td>错误码归类 → 限流（RPM/TPM 超限）→ 上游超时 → 重试策略</td></tr>
          <tr><td>私有化部署失败</td><td>环境核对（GPU 驱动/显存）→ 镜像拉取（内网仓库）→ K8s 调度（GPU 标签）</td></tr></table>
          <p>通用套路：<b>先复现 → 收信息（时间/范围/变更）→ 分层排查 → 根因 → 预防</b>。和你 Linux 的七层排查法同一套思维。</p>`},
        { id:11, title:'面试亮点：你的私有化实战', tags:['面试','实战'],
          content:`<p class="kbox"><b>你的差异化卖点（面试主动讲）：</b>三节点 K8s 裸集群（kubeadm + containerd + flannel）从零搭起，就是一次完整的<b>私有化部署</b>。真实踩过的坑全都能讲成案例：</p>
          <div class="code-block">· 国内镜像拉取超时 → daocloud 加速（HiAgent 私有化同样会遇到内网镜像问题）
· 节点重启后 flannel 崩溃 → 内核模块持久化
· 磁盘白扩 → growpart/resize2fs 在线扩容
· 受限 kubeconfig 证书脱敏 → --raw 修复
· 三节点全宕 → 重启自愈，etcd 数据完好</div>
          <p>把这些组织成"现象→定位→根因→修复"的案例讲出来，就是最好的私有化部署经验证明。</p>`}
      ]}
    ]
  },
  /* @@MODULES_NEXT@@ */
];

const QUIZ = [
  { q:'实时跟踪日志文件新增内容，用哪个命令？', options:['cat file','tail -f file','less file','head file'], answer:1, module:1,

  { q:'下面哪条命令属于运维高危操作，生产环境必须慎用？', options:['ls -l','rm -rf /opt/app','grep error app.log','tail -f app.log'], answer:1, module:1,
    explain:'rm -rf 递归强制删除，路径写错（如 rm -rf / 或 /var/lib 手滑）会删掉系统或数据。删除前先 ls 确认路径，或先用 mv 到临时目录。' },
  { q:'TCP 三次握手中，第二次报文是？', options:['SYN','SYN+ACK','ACK','FIN'], answer:1, module:1,
    explain:'握手过程：①客户端发 SYN → ②服务端回 SYN+ACK（确认收到 + 请求建立）→ ③客户端回 ACK。第二次必须同时带 SYN 和 ACK。' },
  { q:'TCP 四次挥手中，关闭连接由谁先发起？', options:['谁都可以（主动关闭方）','必须是服务端','必须是客户端','由中间设备发起'], answer:0, module:1,
    explain:'任何一方都可以主动发起 FIN（主动关闭方）。被动方先回 ACK，处理完数据再回 FIN——所以挥手要四次（ACK 与 FIN 不能合并）。' },
  { q:'Nginx 返回 502 Bad Gateway 通常意味着？', options:['客户端请求格式错误','上游后端服务不可达或出错','请求资源不存在','未认证'], answer:1, module:1,
    explain:'502 = 网关拿到了上游的无效响应（上游挂了/没监听/超时返回错误）。先查后端服务健康与 Nginx 到后端的连通性。' },
  { q:'dig example.com 查不到解析，但 getent hosts example.com 有结果，说明？', options:['DNS 服务器故障','本地 /etc/hosts 有记录且优先','域名不存在','网络断开'], answer:1, module:1,
    explain:'getent 走系统解析器（含 /etc/hosts），dig 直接查 DNS。hosts 优先于 DNS，所以 hosts 有记录时系统解析成功、DNS 查不到是正常的——排障先分清是哪条链路。' },
  { q:'防火墙的"五元组"不包括？', options:['源 IP','目的端口','协议','HTTP 路径'], answer:3, module:1,
    explain:'五元组 = 源 IP、源端口、目的 IP、目的端口、协议。HTTP 路径是七层内容，防火墙（四层）看不到，WAF 才看。' },
  { q:'容器实现进程隔离和资源限制分别靠什么？', options:['Namespace / Cgroups','Cgroups / Namespace','UnionFS / Namespace','Cgroups / UnionFS'], answer:0, module:2,
    explain:'Namespace 隔离视图（PID/网络/挂载），Cgroups 限制资源（CPU/内存）。容器 = 进程隔离 + 资源限制，共享宿主机内核。' },
  { q:'K8s 1.24+ 节点上镜像拉取失败，应该检查哪个配置？', options:['Docker daemon 的 registry-mirrors','/etc/containerd/certs.d/ 下的 hosts.toml','/etc/docker/daemon.json','kubelet 的 --image 参数'], answer:1, module:2,
    explain:'K8s 1.24+ 用 containerd 直接作为运行时，不再走 Docker daemon。镜像加速配置在 /etc/containerd/certs.d/<仓库>/hosts.toml。' },
  { q:'国内拉取镜像最稳的加速方式是？', options:['Docker Hub 直连','配置 daocloud 镜像源到 containerd','用 VPN','下载镜像包手工导入'], answer:1, module:2,
    explain:'实战验证：containerd 的 hosts.toml 配置 docker.m.daocloud.io / k8s.m.daocloud.io 加速，重启 containerd 后 ImagePullBackOff 全部恢复。' },
  { q:'镜像分层的最大好处是？', options:['运行更快','相同层可复用、节省存储和带宽','镜像更安全','支持更多 CPU 架构'], answer:1, module:2,
    explain:'每层有 hash，相同层可复用：多个镜像共享基础层，拉取只拉差异层——省存储、省带宽、加快部署。' },
  { q:'K8s 中最小调度单元是？', options:['容器','Pod','Deployment','Node'], answer:1, module:4,
    explain:'Pod 是一个或多个共享网络/存储的容器集合，是 K8s 的调度单位。Deployment 管理 Pod，不是调度单元。' },
  { q:'Deployment 适合管理哪类应用？', options:['有状态应用','无状态应用','数据库','etcd'], answer:1, module:4,
    explain:'Deployment 管理无状态应用（nginx、API 服务）：滚动更新、回滚、扩缩容。有状态用 StatefulSet（稳定身份+稳定存储）。' },
  { q:'ResourceQuota 在什么时机拦截超限请求？', options:['Pod 运行时','Pod 创建时（API 记账）','节点调度时','Pod 删除时'], answer:1, module:4,

  { q:'LimitRange 的校验发生在哪个环节？', options:['运行时监控','写入 etcd 前的准入校验','调度器','kubelet'], answer:1, module:4,
    explain:'LimitRange 是准入控制（Admission）：对象写入前校验。2Gi 超 max 1Gi 直接拒绝创建。与 Quota（记账型）是两层防线。' },
  { q:'livenessProbe 失败会导致？', options:['从 Service 摘除','容器被重启','节点被驱逐','Pod 被删除'], answer:1, module:4,
    explain:'liveness 失败 → 重启容器（容器卡死但进程在）；readiness 失败 → 从 Service 摘除（不重启）。startupProbe 给慢启动应用缓冲。' },
  { q:'容器内存超过 limits 会发生什么？', options:['CPU 限流','容器被 OOMKill','自动扩容','只记录日志'], answer:1, module:4,

  { q:'滚动更新中 maxSurge 控制什么？', options:['最多同时不可用多少个','最多比期望多创建多少个','最大回滚版本数','最大副本数'], answer:1, module:4,

  { q:'kubectl get endpoints 显示的是？', options:['Pod 的 DNS 记录','Service 实际挂载的后端 Pod IP:Port 列表','节点 IP','镜像仓库地址'], answer:1, module:5,

  { q:'PSA restricted 策略下，nginx 官方镜像通常遇到什么问题？', options:['镜像太大','默认以 root 运行被拒绝','无法拉取','CPU 超限'], answer:1, module:6,

/* =========================================================
   状态管理（localStorage 持久化）
   ========================================================= */
const LS_KEY = 'ops-learning-hub-v1';
const state = {
  done:new Set(), star:new Set(), mode:'browse', idx:0, loop:0,
  quizOrder:[], quizPos:0, quizLocked:false
};
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY); if(!raw) return;
    const d=JSON.parse(raw);
    state.done=new Set(d.done||[]); state.star=new Set(d.star||[]);
    state.idx=d.idx||0; state.loop=d.loop||0;
  }catch(e){}
}
function saveState(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify({done:[...state.done],star:[...state.star],idx:state.idx,loop:state.loop}));
  }catch(e){}
}

/* =========================================================
   渲染
   ========================================================= */
const $=s=>document.querySelector(s);
const main=$('#main');
let searchKw='';

function renderNav(){
  const nav=$('#nav');
  nav.innerHTML=MODULES.map((m,i)=>{
    const cls=['nav-item',i===state.idx?'active':'',state.done.has(i)?'done':''].join(' ');
    const cnt=m.sections.reduce((a,s)=>a+s.points.length,0);
    return `<button class="${cls}" data-i="${i}" title="${m.subtitle}">
      <span class="num">${ICONS[m.icon]}</span>
      <span class="nm">${m.title}</span>
      <span class="st">${state.done.has(i)?'✔':cnt+'点'}</span>
    </button>`;
  }).join('');
}

function updateStats(){
  const rate=Math.round(state.done.size/MODULES.length*100);
  $('#st-mastery').textContent=rate+'%';
  $('#st-done').textContent=state.done.size+'/'+MODULES.length;
  $('#st-star').textContent=state.star.size;
  $('#st-loop').textContent=state.loop;
  const bar=$('#st-bar');
  bar.style.width=rate+'%';
  bar.classList.toggle('green',rate>=50);
}

function renderModule(i,into){
  const m=MODULES[i];
  let html=`<div class="topline">
      <div class="crumb">MODULE ${String(i+1).padStart(2,'0')} / ${MODULES.length} · <b>${m.title}</b></div>
      <div class="modebar" style="padding:3px">
        <button class="mode-btn ${state.mode==='browse'?'active':''}" data-mode="browse">浏览</button>
        <button class="mode-btn ${state.mode==='loop'?'active':''}" data-mode="loop">循环</button>
        <button class="mode-btn ${state.mode==='quiz'?'active':''}" data-mode="quiz">自测</button>
      </div>
    </div>
    <div class="module-title"><span class="mico">${ICONS[m.icon]}</span>${m.title}</div>
    <div class="module-sub">${m.subtitle}</div>`;
  m.sections.forEach(s=>{
    html+=`<div class="sec-title">${s.title}</div>`;
    s.points.forEach(p=>{
      const tags=(p.tags||[]).map(t=>{
        const map={重要:'important',关键:'important',核心:'important',实战:'practice',面试:'interview',高危:'critical'};
        const cls=map[t]||'';
        return `<span class="tag ${cls}">${t}</span>`;
      }).join('');
      html+=`<div class="point" id="pt-${i}-${p.id}">
        <div class="point-h">
          <div class="pt">${p.title}</div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${tags}
            <button class="btn-star ${state.star.has(i+':'+p.id)?'on':''}" data-star="${i}:${p.id}" title="收藏">${state.star.has(i+':'+p.id)?'★':'☆'}</button>
          </div>
        </div>
        <div class="point-c">${p.content}</div>
      </div>`;
    });
  });
  html+=`<div class="controls">
      <button class="btn btn-prev" id="btn-prev" ${i===0?'disabled':''}>← 上一模块</button>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="hint">${state.done.has(i)?'已掌握':'未掌握'}</span>
        <button class="btn btn-done ${state.done.has(i)?'completed':''}" id="btn-done">${state.done.has(i)?'✔ 已完成':'标记为已掌握'}</button>
        <button class="btn btn-next" id="btn-next" ${i===MODULES.length-1?'disabled':''}>下一模块 →</button>
      </div>
    </div>`;
  main.innerHTML=html;
  bindModule(i);
}

function bindModule(i){
  $('#btn-prev').onclick=()=>{state.idx=Math.max(0,i-1);saveState();renderNav();renderModule(state.idx)};
  $('#btn-next').onclick=()=>{
    if(i<MODULES.length-1){state.idx=i+1;saveState();renderNav();renderModule(state.idx);}
    else{state.loop++;state.idx=0;saveState();renderNav();renderModule(0);toast('完成一轮，开始第 '+(state.loop+1)+' 轮');}
  };
  $('#btn-done').onclick=()=>{
    if(state.done.has(i)){state.done.delete(i);toast('已取消标记');}
    else{state.done.add(i);toast('模块标记为已掌握');}
    saveState();renderNav();updateStats();renderModule(i);
  };
}

/* =========================================================
   搜索
   ========================================================= */
function doSearch(kw){
  kw=kw.trim().toLowerCase();
  if(!kw){renderModule(state.idx);return;}
  let hits=[];
  MODULES.forEach((m,mi)=>{
    m.sections.forEach(s=>{
      s.points.forEach(p=>{
        const hay=(p.title+' '+stripHtml(p.content)).toLowerCase();
        if(hay.includes(kw)) hits.push({mi,mod:m.title,p});
      });
    });
  });
  if(hits.length===0){
    main.innerHTML=`<div class="empty"><div class="big">NO HITS</div>在 ${MODULES.length} 个模块中未找到「${kw}」<br>换个关键词试试（如：RBAC、Token、DNS）</div>`;
    return;
  }
  const esc=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('('+esc+')','gi');
  main.innerHTML=`<div class="topline"><div class="crumb">SEARCH · <b>${hits.length}</b> 条结果</div></div>`+
    hits.slice(0,80).map(h=>{
      const snip=stripHtml(h.p.content).slice(0,90);
      return `<div class="search-hit" data-goto="${h.mi}:${h.p.id}">
        <div class="sh-mod">${String(h.mi+1).padStart(2,'0')} · ${h.mod}</div>
        <div class="sh-title">${h.p.title.replace(re,'<mark>$1</mark>')}</div>
        <div class="sh-snip">${snip.replace(re,'<mark>$1</mark>')}</div>
      </div>`;
    }).join('');
  main.querySelectorAll('.search-hit').forEach(el=>{
    el.onclick=()=>{
      const [mi,pid]=el.dataset.goto.split(':');
      state.idx=+mi;saveState();renderNav();renderModule(+mi);
      setTimeout(()=>{const t=document.getElementById('pt-'+mi+'-'+pid);if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.style.outline='2px solid var(--amber)';setTimeout(()=>t.style.outline='',2500);}},60);
    };
  });
}

function stripHtml(html){
  const d=document.createElement('div');d.innerHTML=html;return d.textContent||'';
}

/* =========================================================
   自测
   ========================================================= */
function initQuiz(shuffle){
  state.quizOrder=QUIZ.map((_,i)=>i);
  if(shuffle) state.quizOrder.sort(()=>Math.random()-0.5);
  state.quizPos=0;state.quizLocked=false;state.quizCorrect=0;
  renderQuiz();
}
function renderQuiz(){
  const total=QUIZ.length;
  if(state.quizPos>=total){
    const pct=Math.round(state.quizCorrect/total*100);
    main.innerHTML=`<div class="quiz-end">
      <div class="big">${pct}%</div>
      <div class="note">本轮 ${total} 题 · 答对 <b style="color:var(--green)">${state.quizCorrect}</b> 题
        <br>得分 &lt;80% 建议回到对应模块再复习一遍</div>
      <button class="btn btn-next" id="q-restart">随机抽题再来一轮</button>
    </div>`;
    $('#q-restart').onclick=()=>initQuiz(true);
    return;
  }
  const q=QUIZ[state.quizOrder[state.quizPos]];
  const m=MODULES[q.module-1];
  main.innerHTML=`<div class="topline"><div class="crumb">QUIZ MODE · <b>${state.quizPos+1}/${total}</b></div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="quiz-score">得分 <b>${state.quizCorrect}</b>/<span style="color:var(--ink3)">${state.quizPos}</span></span>
      <button class="btn btn-prev" id="q-prev" ${state.quizPos===0?'disabled':''}>上一题</button>
      <button class="btn btn-next" id="q-next">下一题 →</button>
      <button class="btn btn-prev" id="q-random" title="随机抽题">↻ 随机</button>
    </div></div>
    <div class="quiz-q"><span class="qmod">${String(q.module).padStart(2,'0')} · ${m.title}</span><br>${q.q}</div>
    ${q.options.map((o,i)=>`<button class="quiz-opt" data-a="${i}"><span class="opt-key">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}
    <div class="quiz-explain" id="q-exp"><b>解析：</b>${q.explain}</div>`;
  const opts=main.querySelectorAll('.quiz-opt');
  opts.forEach(b=>{
    b.onclick=()=>{
      if(state.quizLocked)return;
      state.quizLocked=true;
      const sel=+b.dataset.a;
      if(sel===q.answer)state.quizCorrect++;
      const sc=main.querySelector('.quiz-score');
      if(sc)sc.innerHTML=`得分 <b>${state.quizCorrect}</b>/<span style="color:var(--ink3)">${state.quizPos+1}</span>`;
      opts.forEach((o,i)=>{
        o.disabled=true;
        if(i===q.answer)o.classList.add('correct');
        if(i===sel&&i!==q.answer)o.classList.add('wrong');
      });
      $('#q-exp').classList.add('show');
    };
  });
  $('#q-prev').onclick=()=>{if(state.quizPos>0){state.quizPos--;state.quizLocked=false;renderQuiz();}};
  $('#q-next').onclick=()=>{if(state.quizPos<total-1){state.quizPos++;state.quizLocked=false;renderQuiz();}};
  $('#q-random').onclick=()=>initQuiz(true);
}

/* =========================================================
   模式切换 / 事件
   ========================================================= */
function setMode(mode){
  state.mode=mode;saveState();
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  if(mode==='browse'){renderModule(state.idx);}
  else if(mode==='loop'){renderModule(state.idx);}
  else{initQuiz(true);}
}
setMode(state.mode);

$('#nav').addEventListener('click',e=>{
  const it=e.target.closest('.nav-item');if(!it)return;
  state.idx=+it.dataset.i;saveState();renderNav();renderModule(state.idx);
});
$('#search-input').addEventListener('input',e=>{
  searchKw=e.target.value;
  $('#search-clear').classList.toggle('show',!!searchKw);
  doSearch(searchKw);
});
$('#search-clear').onclick=()=>{$('#search-input').value='';searchKw='';$('#search-clear').classList.remove('show');renderModule(state.idx);};
document.addEventListener('click',e=>{
  const mb=e.target.closest('.mode-btn');
  if(mb){setMode(mb.dataset.mode);return;}
  const st=e.target.closest('[data-star]');
  if(st){
    const k=st.dataset.star;
    if(state.star.has(k)){state.star.delete(k);st.classList.remove('on');st.textContent='☆';toast('取消收藏');}
    else{state.star.add(k);st.classList.add('on');st.textContent='★';toast('已收藏');}
    saveState();updateStats();
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(state.mode==='browse'||state.mode==='loop'){
    if(e.key==='ArrowLeft'){if(state.idx>0){state.idx--;saveState();renderNav();renderModule(state.idx);}}
    if(e.key==='ArrowRight'){if(state.idx<MODULES.length-1){state.idx++;saveState();renderNav();renderModule(state.idx);}}
  }
});

let toastTimer;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* =========================================================
   启动
   ========================================================= */
loadState();
renderNav();
updateStats();
renderModule(state.idx);
</script>
</body>
</html>
